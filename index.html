<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>泵站值守台账</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <h1>泵站值守台账</h1>
    <div class="operator-box">
      <label>当前值班人
        <input id="operator" type="text" placeholder="填写姓名" maxlength="20" />
      </label>
    </div>
  </header>

  <!-- 实时告警条 -->
  <section id="alerts" class="alerts" aria-live="polite"></section>

  <!-- 水位登记 -->
  <section class="panel">
    <h2>水位登记</h2>
    <form id="water-form" class="water-form">
      <label>当前水位（米）
        <input id="water-level" type="number" step="0.01" min="0" required placeholder="如 5.20" />
      </label>
      <button type="submit">登记水位</button>
      <label class="safety-line">安全线（米）
        <input id="safety-line" type="number" step="0.01" min="0" value="5.00" />
      </label>
      <span id="water-status" class="water-status"></span>
    </form>
  </section>

  <!-- 泵组状态 -->
  <section class="panel">
    <h2>泵组状态（预置四台）</h2>
    <div id="pumps" class="pumps-grid"></div>
  </section>

  <!-- 交接班 -->
  <section class="panel">
    <h2>交接班登记</h2>
    <form id="handover-form" class="handover-form">
      <div class="handover-row">
        <label>交班人
          <input id="handover-from" type="text" required maxlength="20" />
        </label>
        <label>接班人
          <input id="handover-to" type="text" required maxlength="20" />
        </label>
      </div>
      <div id="handover-pumps" class="handover-pumps"></div>
      <p class="hint">交接时仍在运行的泵需逐台填写本轮剩余分钟，下一班按此继续计时；停泵仍须等水位回到安全线以下。</p>
      <button type="submit" class="primary">完成交接</button>
    </form>
  </section>

  <!-- 运行台账 -->
  <section class="panel">
    <div class="ledger-head">
      <h2>运行台账</h2>
      <select id="ledger-filter">
        <option value="all">全部记录</option>
        <option value="alert">违规 / 超时</option>
        <option value="run">启停 / 换泵</option>
        <option value="water">水位</option>
        <option value="handover">交接班</option>
        <option value="maint">检修</option>
      </select>
    </div>
    <table class="ledger">
      <thead>
        <tr><th>时间</th><th>类型</th><th>内容</th></tr>
      </thead>
      <tbody id="ledger-body"></tbody>
    </table>
  </section>

  <footer class="footer">
    <span>数据仅保存在本机浏览器（localStorage）</span>
    <div class="footer-actions">
      <button id="btn-export" type="button">导出存档</button>
      <button id="btn-import" type="button">导入存档</button>
      <input id="import-file" type="file" accept="application/json" hidden />
      <button id="btn-clear" type="button" class="danger">清空存档</button>
    </div>
  </footer>

  <div id="toast" class="toast" role="status"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
